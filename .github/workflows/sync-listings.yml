name: Sync apartment listings

# Runs every hour: adds new Craigslist listings matching data/search-criteria.json
# and marks any listings that have been taken down as off-market. Commits the
# updated data/apartments.json back to the repo so the site picks it up.
#
# NOTE: GitHub only registers a scheduled workflow when a push modifies this
# file. If the schedule ever stops firing (e.g. after a history rewrite), push
# any edit to this file to re-register it.

on:
  schedule:
    - cron: '0 * * * *' # top of every hour (UTC)
  workflow_dispatch: {} # allow manual runs from the Actions tab

permissions:
  contents: write

concurrency:
  group: sync-listings
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Sync listings (add new + off-market sweep)
        run: node scripts/sync-listings.mjs

      - name: Commit & push changes
        run: |
          if [[ -n "$(git status --porcelain data/apartments.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/apartments.json
            git commit -m "Auto-sync Craigslist listings (add new, mark off-market)"
            git push
          else
            echo "No changes to commit."
          fi
